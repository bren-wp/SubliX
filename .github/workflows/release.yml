name: Publish signed Free and Pro editions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sublix-release
  cancel-in-progress: false

jobs:
  # A merge to main is not itself a new application version. Previously every
  # merge tried to recreate the already-published v0.1.7 GitHub release.
  # Detect the existing tag BEFORE running expensive Android builds.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and decide whether a release is needed
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="$(tr -d '[:space:]' < VERSION)"
          test -n "$v" || { echo "::error::VERSION is empty"; exit 1; }
          grep -Fq "versionName = \"$v\"" app/build.gradle.kts || {
            echo "::error::VERSION and Android versionName differ."
            exit 1
          }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SubliX v$v already exists. Skipping publication on this main push; increment VERSION, versionName and versionCode for a new release."
            echo "### No new release" >> "$GITHUB_STEP_SUMMARY"
            echo "SubliX v$v already exists. Existing release was preserved; no build was re-published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "### Publishing new SubliX v$v" >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate and configure Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Prepare release signing identity
        env:
          SIGNING_KEYSTORE: ${{ secrets.SUBLIX_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.SUBLIX_STORE_PASSWORD }}
          ALIAS: ${{ secrets.SUBLIX_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SUBLIX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/sublix-release.jks"
          if [ -n "$SIGNING_KEYSTORE" ] && [ -n "$STORE_PASS" ] && [ -n "$ALIAS" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$SIGNING_KEYSTORE" | base64 -d > "$key_file"
            echo "SIGNING_MODE=PRODUCTION_SECRETS" >> "$GITHUB_ENV"
            signing_store_pass="$STORE_PASS"
            signing_key_pass="$KEY_PASS"
            signing_alias="$ALIAS"
          elif [ -z "$SIGNING_KEYSTORE" ] && [ -z "$STORE_PASS" ] && [ -z "$ALIAS" ] && [ -z "$KEY_PASS" ]; then
            echo "::warning::No signing secrets: publishing TEST-ONLY previews signed with a temporary CI key. Previews cannot update one another."
            signing_store_pass="Preview$GITHUB_RUN_ID-Key"
            signing_key_pass="$signing_store_pass"
            signing_alias="ci-preview"
            keytool -genkeypair -noprompt -keystore "$key_file" -alias "$signing_alias" -keyalg RSA -keysize 3072 -validity 30 -storepass "$signing_store_pass" -keypass "$signing_key_pass" -dname "CN=UNTRUSTED SubliX CI Preview, O=BRENDIGO, C=HR"
            echo "SIGNING_MODE=UNTRUSTED_CI_PREVIEW" >> "$GITHUB_ENV"
          else
            echo "::error::Partial signing configuration. Supply all four SUBLIX secrets or none for test-only previews."
            exit 1
          fi
          chmod 600 "$key_file"
          {
            echo "SUBLIX_KEYSTORE_PATH=$key_file"
            echo "SUBLIX_STORE_PASSWORD=$signing_store_pass"
            echo "SUBLIX_KEY_PASSWORD=$signing_key_pass"
            echo "SUBLIX_KEY_ALIAS=$signing_alias"
          } >> "$GITHUB_ENV"
      - name: Build tests, signed APKs and AABs
        run: |
          gradle --no-daemon clean :app:testFreeDebugUnitTest :app:testProDebugUnitTest :app:assembleFreeRelease :app:assembleProRelease :app:bundleFreeRelease :app:bundleProRelease
      - name: Verify Free and Pro Android package IDs
        run: bash scripts/verify_application_ids.sh app/build/outputs/apk/free/release/app-free-release.apk app/build/outputs/apk/pro/release/app-pro-release.apk
      - name: Verify shipped native libraries and Play Store media
        run: |
          python3 scripts/check_native_libs.py
          python3 -m pip install --disable-pip-version-check -r scripts/play_assets_requirements.txt
          python3 scripts/validate_captures.py
          python3 scripts/build_play_assets.py
          python3 scripts/build_play_assets.py --check
          python3 scripts/check_play_listing.py
      - name: Verify signatures and create source archive
        run: |
          set -euo pipefail
          mkdir -p dist
          v="$(tr -d '[:space:]' < VERSION)"
          grep -Fq "versionName = \"$v\"" app/build.gradle.kts || { echo "::error::VERSION and app versionName differ"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/free/release/app-free-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/pro/release/app-pro-release.apk
          jarsigner -verify app/build/outputs/bundle/freeRelease/app-free-release.aab
          jarsigner -verify app/build/outputs/bundle/proRelease/app-pro-release.aab
          cp app/build/outputs/apk/free/release/app-free-release.apk "dist/SubliX-Free-v${v}.apk"
          cp app/build/outputs/apk/pro/release/app-pro-release.apk "dist/SubliX-Pro-v${v}.apk"
          cp app/build/outputs/bundle/freeRelease/app-free-release.aab "dist/SubliX-Free-v${v}.aab"
          cp app/build/outputs/bundle/proRelease/app-pro-release.aab "dist/SubliX-Pro-v${v}.aab"
          git archive --format zip --output="dist/SubliX-Source-v${v}.zip" HEAD
          python3 - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path("play-store")
          version=pathlib.Path("VERSION").read_text().strip()
          dest=pathlib.Path("dist")/f"SubliX-Play-Store-Assets-v{version}.zip"
          with zipfile.ZipFile(dest,"w",zipfile.ZIP_DEFLATED,compresslevel=8) as archive:
              for asset in sorted(root.rglob("*")):
                  if asset.is_file(): archive.write(asset,asset.as_posix())
          print("Built store listing media ZIP:",dest)
          PY
          (cd dist && sha256sum *.apk *.aab *.zip > SHA256SUMS.txt)
      - name: Publish versioned Free/Pro preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="$(tr -d '[:space:]' < VERSION)"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$v already exists. Increment VERSION and Android versionCode/versionName."
            exit 1
          fi
          {
            if [ "$SIGNING_MODE" = "UNTRUSTED_CI_PREVIEW" ]; then
              echo "> ⚠️ **TEST ONLY / UNTRUSTED SIGNATURE.** APK and AAB use a fresh temporary CI signing key, NOT a production/Google Play signing identity. Builds from different CI runs cannot update each other. Uninstalling the prior app can erase its local data. Never store private financial records in these preview builds."
            else
              echo "> Signed using configured private GitHub repository signing secrets. Device QA and policy checks still required before stable production promotion."
            fi
            echo
            cat docs/RELEASE_NOTES.md
          } > "$RUNNER_TEMP/notes.md"
          gh release create "v$v" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SubliX v$v — Free + Pro (Preview)" --notes-file "$RUNNER_TEMP/notes.md" --prerelease
