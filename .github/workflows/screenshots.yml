name: Capture genuine Android emulator screenshots

on:
  push:
    branches: ['feature/**', 'fix/**']
    paths:
      # A release version bump or web-gallery contract change must refresh
      # native screenshots before publishing its signed Android artifacts.
      - 'VERSION'
      - 'app/**'
      - 'web/index.html'
      - 'scripts/check_sync.py'
      - 'scripts/capture_screenshots.sh'
      - 'scripts/build_play_assets.py'
      - 'scripts/check_play_listing.py'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sublix-captures-${{ github.ref_name }}
  # A new source commit supersedes screenshots from older code. Do not allow
  # stale emulator jobs to block the latest PR capture for many minutes.
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          # Full history is needed to rebase generated PNGs onto newer PR commits.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK 36
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build both debug editions and Compose instrumentation suites
        run: gradle --no-daemon :app:assembleFreeDebug :app:assembleProDebug :app:assembleFreeDebugAndroidTest :app:assembleProDebugAndroidTest
      - name: Install and test the PNG integrity gate before emulator capture
        run: |
          python3 -m pip install --disable-pip-version-check pillow==11.3.0
          python3 -m unittest discover -s scripts -p 'test_validate_captures.py'
      - name: Enable KVM acceleration when available
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo "::warning::KVM is unavailable; emulator may run slowly"; fi
      - name: Boot emulator and capture installed apps
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_4
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            gradle --no-daemon :app:connectedFreeDebugAndroidTest :app:connectedProDebugAndroidTest
            bash scripts/capture_screenshots.sh
      # Diagnostics are private-to-the-workflow artifacts for troubleshooting.
      # Failed/partial captures must NEVER be copied to web, README or Play media.
      - name: Preserve raw emulator frames for failed-capture diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sublix-raw-emulator-capture-diagnostics-${{ github.run_id }}
          path: |
            brending/screenshots-real/free/*.png
            brending/screenshots-real/pro/*.png
            build/adaptive/
          retention-days: 3
          if-no-files-found: warn
      - name: Upload interactive Compose instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SubliX-v0.1.7-Free-Pro-interaction-tests
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload narrow-screen accessibility smoke frames
        uses: actions/upload-artifact@v4
        with:
          name: SubliX-v0.1.6-narrow-phone-large-text
          path: build/adaptive/
          retention-days: 14
      - name: Reject contaminated captures before visual audit
        run: |
          python3 -m pip install --disable-pip-version-check pillow==11.3.0
          tr -d '[:space:]' < VERSION > brending/screenshots-real/CAPTURE_VERSION
          python3 scripts/validate_captures.py
      - name: Audit screenshot regressions
        run: python3 scripts/visual_audit.py
      - name: Publish screenshots to PR branch
        run: |
          set -euo pipefail
          test "$(find brending/screenshots-real -name '*.png' | wc -l)" -eq 45
          tr -d '[:space:]' < VERSION > brending/screenshots-real/CAPTURE_VERSION

          python3 scripts/use_real_screenshots.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p web/assets/screenshots/free web/assets/screenshots/pro
          cp brending/screenshots-real/free/*.png web/assets/screenshots/free/
          cp brending/screenshots-real/pro/*.png web/assets/screenshots/pro/
          python3 scripts/check_sync.py
          python3 -m pip install --disable-pip-version-check -r scripts/play_assets_requirements.txt
          python3 scripts/build_play_assets.py
          python3 scripts/build_play_assets.py --check
          python3 scripts/check_play_listing.py
          git add brending/screenshots-real web/assets/screenshots README.md docs/VISUAL_AUDIT.md docs/VISUAL_AUDIT.json play-store/
          git diff --cached --quiet || git commit -m "docs: update real Android captures, website gallery and visual audit [skip screenshots]"
          # Emulator jobs can take several minutes. The PR head may advance while
          # capturing, so a direct push can be rejected as non-fast-forward.
          # Rebase onto the latest PR head without rewriting any remote history.
          # If assets conflict with concurrent changes, fail closed for review.
          for attempt in 1 2 3; do
            git fetch origin "refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
            # Never publish screenshots from an older version of app code.
            # A newer source commit requires fresh emulator captures.
            if ! git diff --quiet "$GITHUB_SHA" "refs/remotes/origin/$GITHUB_REF_NAME" -- app/ scripts/capture_screenshots.sh; then
              echo "::error::Android source or capture logic changed during this run. Re-capture from the newer PR head."
              exit 1
            fi
            git rebase "refs/remotes/origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then
              echo "Generated screenshots safely published at current PR head."
              exit 0
            fi
            echo "::warning::PR branch advanced during screenshot publication (attempt $attempt/3); rebasing and retrying."
            sleep 3
          done
          echo "::error::Unable to publish verified screenshots without overwriting concurrent PR changes."
          exit 1
