name: Android and website checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Avoid burning Android runners on superseded PR commits.
concurrency:
  group: sublix-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate static site and SVG branding
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          root=pathlib.Path(".")
          svg=list((root/"brending").rglob("*.svg"))+list((root/"web/assets").glob("*.svg"))
          assert len(svg)>=20
          for p in svg: ET.parse(p)
          assert (root/"web/index.html").is_file()
          page=(root/"web/index.html").read_text(encoding="utf-8")
          assert "SubliX" in page and "BRENDIGO" in page
          assert "<form" not in page.lower()
          assert (root/"web/privacy.html").is_file()
          print(f"Validated {len(svg)} SVG assets and static site")
          PY
      - name: Enforce security, edition and dead-code release audit
        run: python3 scripts/audit_release.py
      - name: Validate JavaScript syntax
        run: node --check web/app.js
      - name: Validate Android/web feature and design parity
        run: python3 scripts/check_sync.py
      - name: Validate localized Play metadata before emulator captures
        run: python3 scripts/check_play_listing.py --metadata-only
      # Actual 0.1.5 Android captures and final Play PNG media
      # are generated and validated in screenshots.yml after emulator execution.



  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate and configure Android SDK 37.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-37.1" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Unit tests and both Android editions
        run: |
          gradle --no-daemon :app:testFreeDebugUnitTest :app:testProDebugUnitTest :app:assembleFreeDebug :app:assembleProDebug :app:bundleFreeRelease :app:bundleProRelease
          python3 scripts/check_native_libs.py
      - name: Android Lint - both release editions
        run: gradle --no-daemon :app:lintFreeRelease :app:lintProRelease
      - name: Verify Free and Pro Android package IDs
        run: bash scripts/verify_application_ids.sh app/build/outputs/apk/free/debug/app-free-debug.apk app/build/outputs/apk/pro/debug/app-pro-debug.apk
      - name: Store build outputs for review
        uses: actions/upload-artifact@v4
        with:
          name: sublix-ci-unsigned-bundles-and-debug-apks
          path: |
            app/build/outputs/apk/free/debug/*.apk
            app/build/outputs/apk/pro/debug/*.apk
            app/build/outputs/bundle/freeRelease/*.aab
            app/build/outputs/bundle/proRelease/*.aab
          retention-days: 7
