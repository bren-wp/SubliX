version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zagreb
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"
      android-build:
        patterns:
          - "com.android.*"
          - "org.jetbrains.kotlin.*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Zagreb
    open-pull-requests-limit: 5
